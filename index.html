<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlightDeck Community Overlay</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- ==========================================
         LEFT PANEL
    =========================================== -->

    <div class="panel left">

        <div class="header">

            <span class="label">
                LATEST PASSENGER
            </span>

            <div class="line"></div>

            <div class="dot"></div>

        </div>

        <div class="content">

            <span id="latestPassenger" class="name">
                sven2208090
            </span>

            <span class="subtitle">
                Welcome on board
            </span>

        </div>

        <div class="aircraft">
            ✈
        </div>

    </div>


<!-- ==========================================
     RIGHT PANEL
========================================== -->

<div class="panel right">

    <div class="header">

        <span class="label">
            LATEST FIRST OFFICER
        </span>

        <div class="stripes">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="line"></div>

        <div class="dot"></div>

    </div>

    <div class="content">

        <span id="latestFirstOfficer" class="name">
            sven2208090
        </span>

        <span class="subtitle">
            Thank you for your support
        </span>

   <div class="aircraft">

    <span class="air-line"></span>

    <span class="plane">✈</span>

    <span class="air-line"></span>

</div>

</div>


<script src="js/script.js"></script>

</body>

</html>
